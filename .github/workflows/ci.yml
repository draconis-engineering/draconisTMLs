name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install xmlschema lxml
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Validate schemas
        run: |
          python -c "import xmlschema; [xmlschema.XMLSchema(f'schemas/{s}.xsd') for s in ['dsml','drml','dcml','dtir']]; print('schemas ok')" || true
      - name: Validate examples
        run: |
          node -r ts-node/register/transpile-only tools/validate.ts examples/example.dsml.xml
          node -r ts-node/register/transpile-only tools/validate.ts examples/example.drml.xml
          node -r ts-node/register/transpile-only tools/validate.ts examples/example.dcml.xml
          npx jest --maxWorkers=1 --no-coverage
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --if-present
  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --if-present
      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --access public || echo "Publish skipped or failed"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
